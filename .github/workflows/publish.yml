name: Publish

permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
      - run: aube ci
      - run: aube run build

      - run: jaq -i 'del(.scripts, .devDependencies)' package.json

      - run: |
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            aube publish --access public --no-git-checks --provenance --tag next
          else
            aube publish --access public --no-git-checks --provenance
          fi
